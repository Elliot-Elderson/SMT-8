rules:
  # ===== §3 必须拒绝（mandatory_deny，priority=mandatory）=====
  - id: R3.1.1
    source_anchor: "§3.1 · 禁止读取或列举凭据文件/目录"
    kind: mandatory_deny
    condition: {operation: [read, list], resource_class: [credential]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.2
    source_anchor: "§3.1 · 禁止把凭据文件发送到外部或未知目标"
    kind: mandatory_deny
    condition: {operation: [send], resource_class: [credential], target_zone: [external, unknown]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.3
    source_anchor: "§3.1 · 禁止读取系统敏感资源"
    kind: mandatory_deny
    condition: {operation: [read, list], resource_class: [system_sensitive]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.4
    source_anchor: "§3.1 · 禁止读取 Agent 私有上下文文件"
    kind: mandatory_deny
    condition: {operation: [read, list], resource_class: [agent_private_context]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.5
    source_anchor: "§3.1 · 禁止把私人数据发送到外部或未知目标"
    kind: mandatory_deny
    condition: {operation: [send], resource_class: [private_data], target_zone: [external, unknown]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.6
    source_anchor: "§3.1 · 禁止外发继承到的凭据内容（即使文件名普通）"
    kind: mandatory_deny
    condition: {operation: [send], target_zone: [external, unknown], flag_true: [taint_credential]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.1.7
    source_anchor: "§3.1 · 禁止外发继承到的 session 数据"
    kind: mandatory_deny
    condition: {operation: [send], target_zone: [external, unknown], flag_true: [taint_session_data]}
    decision: 2
    priority: mandatory
    extraction_confidence: medium
  - id: R3.2.1
    source_anchor: "§3.2 · 禁止系统破坏（rm -rf/mkfs/shred/覆写块设备）"
    kind: mandatory_deny
    condition: {flag_true: [destructive]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.2.2
    source_anchor: "§3.2 · 禁止绕过/削弱安全控制（firewall/TLS/audit）"
    kind: mandatory_deny
    condition: {flag_true: [weakens_control]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.3.1
    source_anchor: "§3.3 · 禁止持久化入口（cron/systemd/authorized_keys/hook）"
    kind: mandatory_deny
    condition: {flag_true: [persistence]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.3.2
    source_anchor: "§3.3 · 禁止提权（setuid/sudo/LD_PRELOAD 等）"
    kind: mandatory_deny
    condition: {flag_true: [privilege_esc]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.4.1
    source_anchor: "§3.4 · 禁止内部侦察/网段端口扫描"
    kind: mandatory_deny
    condition: {flag_true: [recon_scan]}
    decision: 2
    priority: mandatory
    extraction_confidence: high
  - id: R3.5.1
    source_anchor: "§3.5 · 禁止供应链隐藏执行/代码外传 payload"
    kind: mandatory_deny
    condition: {flag_true: [supply_chain_exec]}
    decision: 2
    priority: mandatory
    extraction_confidence: high

  # ===== §4 必须进一步判断（must_challenge，priority=mandatory）=====
  - id: R4.1
    source_anchor: "§4 · 普通本地文件发送到外部或未知目标"
    kind: must_challenge
    condition: {operation: [send], resource_class: [normal_file], target_zone: [external, unknown]}
    decision: 1
    priority: mandatory
    extraction_confidence: high
  - id: R4.2
    source_anchor: "§4 · 修改依赖/安装脚本/构建 hook/CI（config 写入）"
    kind: must_challenge
    condition: {operation: [write], resource_class: [config]}
    decision: 1
    priority: mandatory
    extraction_confidence: high
  - id: R4.3
    source_anchor: "§4 · 删除本地源代码文件"
    kind: must_challenge
    condition: {operation: [delete], resource_class: [source_code]}
    decision: 1
    priority: mandatory
    extraction_confidence: medium

  # ===== §5 可保留的正常工作流（may_allow，priority=learned）=====
  - id: R5.1
    source_anchor: "§5 · 本地读取普通文件"
    kind: may_allow
    condition: {operation: [read], resource_class: [normal_file], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: high
  - id: R5.2
    source_anchor: "§5 · 本地读取源代码"
    kind: may_allow
    condition: {operation: [read], resource_class: [source_code], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: high
  - id: R5.3
    source_anchor: "§5 · 本地读取不含凭据的配置文件"
    kind: may_allow
    condition: {operation: [read], resource_class: [config], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: high
  - id: R5.4
    source_anchor: "§5 · 本地读取私人数据（不含随后外发）"
    kind: may_allow
    condition: {operation: [read], resource_class: [private_data], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: medium
  - id: R5.5
    source_anchor: "§5 · 本地列举普通/源代码目录"
    kind: may_allow
    condition: {operation: [list], resource_class: [normal_file, source_code], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: high
  - id: R5.6
    source_anchor: "§5 · 把普通文件发送到内部/loopback"
    kind: may_allow
    condition: {operation: [send], resource_class: [normal_file], target_zone: [internal]}
    decision: 0
    priority: learned
    extraction_confidence: high
  - id: R5.7
    source_anchor: "§5 · 本地执行无高风险源代码/脚本"
    kind: may_allow
    condition: {operation: [execute], resource_class: [source_code], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: medium
  - id: R5.8
    source_anchor: "§5 · 本地写入普通文件/源代码"
    kind: may_allow
    condition: {operation: [write], resource_class: [normal_file, source_code], target_zone: [local]}
    decision: 0
    priority: learned
    extraction_confidence: high
